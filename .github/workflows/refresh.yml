name: Refresh employer postings

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      employer:
        description: "Optional employer ID from config/employers; empty checks all enabled employers"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Fetch and validate without changing committed data or views"
        required: true
        type: boolean
        default: false
      force_details:
        description: "Recheck details even when the cached description is fresh"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meche-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up pinned Python and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          python-version: "3.14.6"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate committed state
        run: uv run --locked meche-tracker validate
      - name: Refresh
        env:
          EMPLOYER: ${{ inputs.employer || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE_DETAILS: ${{ inputs.force_details || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$EMPLOYER" ]]; then
            if [[ ! "$EMPLOYER" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "::error::employer must be a configuration ID."
              exit 1
            fi
            args+=(--employer "$EMPLOYER")
          fi
          case "$DRY_RUN" in
            true) args+=(--dry-run) ;;
            false) ;;
            *) echo "::error::Invalid dry_run value."; exit 1 ;;
          esac
          case "$FORCE_DETAILS" in
            true) args+=(--force-details) ;;
            false) ;;
            *) echo "::error::Invalid force_details value."; exit 1 ;;
          esac
          uv run --locked meche-tracker refresh "${args[@]}" | tee "$RUNNER_TEMP/meche-report.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "meche-report.json").read_text())
          lines = ["## Collection result", "", f"Started: {report['started_at']}", ""]
          for label, field in [("Employers checked", "employers_checked"),
                               ("Complete sources", "sources_complete"),
                               ("Sources with errors", "source_errors"),
                               ("New discoveries", "discovered"),
                               ("Reopened", "reopened"), ("Closed", "closed")]:
              lines.append(f"- {label}: {report[field]}")
          lines.extend(["", "See data/source_health.json for collection diagnostics.", ""])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("\n".join(lines))
          PY
      - name: Validate refreshed state
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: uv run --locked meche-tracker validate
      - name: Commit generated data and views
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          base_sha="$(git rev-parse HEAD)"
          git add -- README.md data/jobs.json data/source_health.json
          git add -A -- views
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          # Validate the exact staged allowlist; overrides and source configuration
          # can only change in a reviewed contributor commit.
          uv run --locked python - <<'PY'
          import subprocess
          allowed = {"README.md", "data/jobs.json", "data/source_health.json"}
          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"], text=True
          ).split("\0")
          unexpected = [p for p in paths if p and p not in allowed and not (
              p.startswith("views/") and p.endswith(".md")
          )]
          if unexpected:
              raise SystemExit(f"Unexpected staged publication paths: {unexpected}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          remote_sha="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
          if [[ "$remote_sha" != "$base_sha" ]]; then
            echo "::error::The default branch advanced during collection; rerun against current source."
            exit 1
          fi
          git commit -m "data: refresh employer postings"
          # A concurrent push after our check rejects this ordinary push safely.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
