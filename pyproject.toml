[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meche-job-tracker"
version = "0.1.0"
description = "Verified U.S. mechanical engineering internships and co-ops"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "beautifulsoup4>=4.13,<5"]

[project.scripts]
meche-tracker = "meche_tracker.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/meche_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
